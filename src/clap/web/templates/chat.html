<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>CLAP · Chat</title>
<script>{% include "theme.js" %}</script>
<style>{% include "app.css" %}</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><strong>CLAP</strong><span data-i18n="app.subtitle">对话工作台</span></div>
    <select class="model-select" id="model" data-i18n-aria="chat.modelSelect" aria-label="模型（按服务商分组）" title="模型（按服务商分组）">
      <option data-i18n="chat.detecting">正在探测模型…</option>
    </select>
    <select id="lang" class="model-select" style="min-width:96px;max-width:120px" data-i18n-aria="lang.label" title="语言">
      <option value="zh">中文</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
      <option value="fr">Français</option>
      <option value="ru">Русский</option>
      <option value="de">Deutsch</option>
      <option value="es">Español</option>
      <option value="pt">Português</option>
      <option value="it">Italiano</option>
      <option value="ko">한국어</option>
    </select>
    <select id="theme" class="model-select" style="min-width:110px;max-width:150px" data-i18n-aria="theme.label" title="Theme">
      <option value="auto" data-i18n="theme.auto">跟随系统</option>
      <option value="light" data-i18n="theme.light">浅色</option>
      <option value="dark" data-i18n="theme.dark">深色</option>
    </select>
    <button class="icon-btn" id="btn-settings" type="button" data-i18n-title="settings.open" title="设置">⚙</button>
    <nav class="nav">
      <a href="/" class="on" data-i18n="nav.chat">对话</a>
      <a href="/kb" data-i18n="nav.kb">知识库</a>
      <a href="#" id="tl-link" data-i18n="nav.timeline">时间轴</a>
      <a href="/api-docs" data-i18n="nav.api">接口</a>
    </nav>
  </header>

  <div class="toolbar">
    <label class="switch" id="grounded-label" data-i18n-title="chat.grounded.title">
      <input type="checkbox" id="grounded">
      <span class="track"></span><span class="lbl" data-i18n="chat.grounded">有依据模式</span>
    </label>
    <div class="zim-picker">
      <button class="chip" id="zim-btn" type="button"><span data-i18n="chat.zim.prefix">资料库：</span><span id="zim-label" data-i18n="chat.zim.all">全部</span> <span id="zim-count"></span></button>
      <div class="menu" id="zim-menu"></div>
    </div>
    <span class="sep"></span>
    <div class="group" id="branch-bar"><span class="chip on" data-i18n="branch.loading">分支加载中…</span></div>
    <span class="sep"></span>
    <div class="group">
      <button class="btn ghost small" id="btn-export" type="button" data-i18n="chat.export">导出</button>
      <button class="btn ghost small" id="btn-share" type="button" data-i18n="chat.share">分享</button>
      <button class="btn ghost small" id="btn-renew" type="button" data-i18n="chat.renew">续期</button>
      <button class="btn ghost small" id="btn-new" type="button" data-i18n="chat.new">新会话</button>
    </div>
    <span class="spacer"></span>
    <span class="status" id="status" data-i18n="chat.status.ready">就绪</span>
  </div>

  <main class="workspace">
    <div class="chat-col">
      <section class="panel flow" id="flow" aria-live="polite" aria-label="消息流">
        <p class="empty" data-i18n="chat.empty">还没有消息。选好模型后输入问题，按 Enter 发送。</p>
      </section>

      <section class="panel composer">
        <textarea id="input" data-i18n-placeholder="chat.input.placeholder" placeholder="输入消息…（Enter 发送，Shift+Enter 换行）"></textarea>
        <div class="composer-row">
          <button class="btn" id="send" data-i18n="chat.send">发送</button>
          <button class="btn stop" id="stop" style="display:none" data-i18n="chat.pause">暂停</button>
          <span class="status" id="mode-line" data-i18n="chat.mode.normal">普通对话</span>
          <span class="spacer"></span>
          <span class="status" id="sess-line">—</span>
        </div>
      </section>
    </div>

    <aside class="side">
      <section class="panel card">
        <h2><span data-i18n="session.heading">会话</span> <span class="hint" data-i18n="session.hint">v2 · 分支 · 标注</span></h2>
        <dl class="kv" id="sess-kv"></dl>
        <div class="field" style="margin-top:10px">
          <label for="sess-path" data-i18n="session.savePath">保存 / 加载路径（.clap 文件）</label>
          <input id="sess-path" placeholder="/absolute/path/session.clap">
        </div>
        <div class="composer-row">
          <button class="btn ghost small" id="save-sess" data-i18n="session.save">保存</button>
          <button class="btn ghost small" id="load-sess" data-i18n="session.load">加载</button>
        </div>
      </section>

      <section class="panel card">
        <h2><span data-i18n="branch.heading">分支</span> <span class="hint" data-i18n="branch.hint">点消息头的「分叉」</span></h2>
        <div class="branch-bar" id="branch-list"></div>
        <p class="empty" id="branch-empty" data-i18n="branch.empty">只有一个主线分支</p>
      </section>

      <section class="panel card">
        <h2><span data-i18n="annotate.heading">标注</span> <span class="hint" data-i18n="annotate.hint">结构化标注</span></h2>
        <form id="ann-form" autocomplete="off">
          <div class="field">
            <label for="ann-target" data-i18n="annotate.target">消息 id（点消息头可自动填入）</label>
            <input id="ann-target" placeholder="m3">
          </div>
          <div class="field">
            <label for="ann-kind" data-i18n="annotate.kind">类型</label>
            <select id="ann-kind">
              <option value="keypoint" data-i18n="annotate.kind.keypoint">重点</option>
              <option value="question" data-i18n="annotate.kind.question">疑问</option>
              <option value="generated" data-i18n="annotate.kind.generated">生成</option>
              <option value="reviewed" data-i18n="annotate.kind.reviewed">讲评</option>
              <option value="error_fix" data-i18n="annotate.kind.error_fix">纠错</option>
              <option value="knowledge_point" data-i18n="annotate.kind.knowledge_point">知识点</option>
            </select>
          </div>
          <div class="field">
            <label for="ann-tags" data-i18n="annotate.tags">标签（逗号分隔）</label>
            <input id="ann-tags">
          </div>
          <div class="field">
            <label for="ann-note" data-i18n="annotate.note">备注</label>
            <textarea id="ann-note"></textarea>
          </div>
          <div class="field">
            <label for="ann-author" data-i18n="annotate.author">标注人</label>
            <input id="ann-author" value="teacher">
          </div>
          <div class="composer-row">
            <button class="btn small" type="submit" data-i18n="annotate.submit">写入标注</button>
            <button class="btn ghost small" type="button" id="ann-export" data-i18n="annotate.exportCsv">导出 CSV</button>
          </div>
        </form>
        <div class="ann-list" id="ann-list"></div>
      </section>

      <section class="panel card">
        <h2><span data-i18n="kb.heading">知识库</span> <span class="hint" data-i18n="kb.hint">ZIM 外置库</span></h2>
        <dl class="kv" id="zim-kv"></dl>
        <div class="actions" style="margin-top:8px">
          <a class="btn ghost small" href="/kb" data-i18n="kb.open">打开知识库</a>
        </div>
      </section>
    </aside>
  </main>

  <footer class="footer">
    <span data-i18n="kb.footer1">密钥只在内存中读取，界面与接口只显示掩码。</span>
    <span data-i18n="kb.footer2">有依据模式：检索 ZIM → 只依据资料回答 → 逐句核对来源。</span>
    <span><a href="/api-docs" data-i18n="kb.footerLink">接口清单 →</a></span>
  </footer>
</div>

<aside class="drawer" id="drawer" aria-label="来源">
  <header>
    <h3 id="drawer-title" data-i18n="drawer.title">来源</h3>
    <button class="icon-btn" id="drawer-close" data-i18n-title="common.close" title="关闭">×</button>
  </header>
  <div class="content" id="drawer-body"></div>
</aside>

<div class="modal" id="modal">
  <div class="box">
    <header><h3 id="modal-title">—</h3><button class="icon-btn" id="modal-close" data-i18n-title="common.close" title="关闭">×</button></header>
    <div class="body" id="modal-body"></div>
    <footer id="modal-foot"></footer>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>{% include "i18n.js" %}</script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const T = (k, v) => CLAPi18n.t(k, v);
  const flow = $("flow");
  const input = $("input");
  const sendBtn = $("send");
  const stopBtn = $("stop");
  const modelSel = $("model");
  const statusEl = $("status");
  const groundedEl = $("grounded");
  const langSel = $("lang");

  const KIND_KEY = {
    keypoint: "annotate.kind.keypoint", question: "annotate.kind.question",
    generated: "annotate.kind.generated", reviewed: "annotate.kind.reviewed",
    error_fix: "annotate.kind.error_fix", knowledge_point: "annotate.kind.knowledge_point"
  };
  const kindText = (k) => T(KIND_KEY[k] || k);

  let currentStream = null;
  let turnNo = 0;
  let branchId = "";
  let zimList = [];
  let zimFilter = [];
  let renewSummary = "";
  let lastMessages = [];
  let lastQuestion = "";
  let pausedFlag = false;
  let busy = false;

  langSel.value = CLAPi18n.lang;
  const themeSel = $("theme");
  themeSel.value = CLAPtheme.mode;
  themeSel.addEventListener("change", () => CLAPtheme.setMode(themeSel.value));
  CLAPtheme.onChange(() => { themeSel.value = CLAPtheme.mode; });

  function setStatus(text, bad) {
    statusEl.textContent = text;
    statusEl.className = "status" + (bad ? " bad" : "");
  }
  function toast(text) {
    const t = $("toast");
    t.textContent = text;
    t.classList.add("show");
    clearTimeout(t._tm);
    t._tm = setTimeout(() => t.classList.remove("show"), 2600);
  }
  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // ---------------- citations ----------------
  const CITE_RE = /\[(\d+(?:\s*[,，]\s*\d+)*)\]/g;
  function renderRich(node, text) {
    node.innerHTML = esc(text).replace(CITE_RE, (m, nums) => {
      return '<span class="cite" data-n="' + esc(nums) + '" title="' + esc(T("msg.citeTitle")) + '">[' + esc(nums) + ']</span>';
    });
    node.querySelectorAll(".cite").forEach((c) => {
      c.addEventListener("click", () => openSourceByNumber(c.dataset.n, c.dataset.q || lastQuestion));
    });
  }

  function openSourceByNumber(nums, question) {
    const n = String(nums).split(",")[0].trim();
    const msg = lastMessages.find((m) => (m.sources || []).some((s) => String(s.n) === n));
    const src = msg && (msg.sources || []).find((s) => String(s.n) === n);
    if (!src) { toast(T("drawer.notFound", { n: n })); return; }
    openSource(src.zim, src.path, src.title, question || "");
  }
  async function openSource(zim, path, title, question) {
    const drawer = $("drawer");
    $("drawer-title").textContent = title || path;
    $("drawer-body").textContent = T("drawer.loading");
    drawer.classList.add("open");
    try {
      let url = "/api/zim/article?zim=" + encodeURIComponent(zim) + "&path=" + encodeURIComponent(path);
      if (question) url += "&q=" + encodeURIComponent(question);
      const r = await fetch(url);
      const j = await r.json();
      if (!j.success) throw new Error(j.error || T("drawer.failed"));
      $("drawer-title").textContent = j.title || title || path;
      const wrap = $("drawer-body");
      wrap.innerHTML = "";
      const meta = el("div", "meta", T("drawer.meta", { zim: j.zim, path: j.path, chars: j.chars }));
      wrap.appendChild(meta);
      const body = el("div", "body");
      const match = j.match;
      if (match && match.start < match.end && match.end <= j.text.length) {
        body.appendChild(document.createTextNode(j.text.slice(0, match.start)));
        const mark = el("mark", "", j.text.slice(match.start, match.end));
        mark.id = "src-highlight";
        body.appendChild(mark);
        body.appendChild(document.createTextNode(j.text.slice(match.end)));
        wrap.appendChild(body);
        setTimeout(() => {
          const target = $("src-highlight");
          if (target) target.scrollIntoView({ block: "center", behavior: "smooth" });
        }, 80);
      } else {
        body.textContent = j.text;
        wrap.appendChild(body);
      }
    } catch (e) {
      $("drawer-body").textContent = T("drawer.failed") + e.message;
    }
  }
  $("drawer-close").addEventListener("click", () => $("drawer").classList.remove("open"));

  // ---------------- modal ----------------
  function openModal(title, bodyNode, footNodes) {
    $("modal-title").textContent = title;
    const body = $("modal-body");
    body.innerHTML = "";
    body.appendChild(bodyNode);
    const foot = $("modal-foot");
    foot.innerHTML = "";
    (footNodes || []).forEach((n) => foot.appendChild(n));
    $("modal").classList.add("open");
  }
  function closeModal() { $("modal").classList.remove("open"); }
  $("modal-close").addEventListener("click", closeModal);
  $("modal").addEventListener("click", (e) => { if (e.target === $("modal")) closeModal(); });

  // ---------------- models ----------------
  async function loadModels() {
    try {
      const r = await fetch("/api/models");
      const j = await r.json();
      if (!j.success) throw new Error(j.error || T("chat.detectFailed"));
      modelSel.innerHTML = "";
      const available = (j.groups || []).filter((g) => g.available && !g.unsupported);
      const unavailable = (j.groups || []).filter((g) => !g.available || g.unsupported);

      available.forEach((g) => {
        const og = document.createElement("optgroup");
        og.label = g.provider + (g.env ? " (" + g.env + ")" : "");
        g.models.forEach((mid) => {
          const o = document.createElement("option");
          o.value = g.provider + "\u0000" + mid;
          o.textContent = mid;
          og.appendChild(o);
        });
        modelSel.appendChild(og);
      });
      if (unavailable.length) {
        const og = document.createElement("optgroup");
        og.label = CLAPi18n.lang === "zh" ? "未配置 / 不可用（不发起调用）" : "Not configured / unavailable (never called)";
        unavailable.forEach((g) => {
          const o = document.createElement("option");
          o.disabled = true;
          o.textContent = g.provider + " — " +
            (g.unsupported ? (CLAPi18n.lang === "zh" ? "协议不支持" : "unsupported protocol")
              : (g.configured ? (CLAPi18n.lang === "zh" ? "连接失败" : "connection failed")
                : (CLAPi18n.lang === "zh" ? "未配置" : "not configured")));
          og.appendChild(o);
        });
        modelSel.appendChild(og);
      }
      const def = j.default || {};
      const wanted = def.provider + "\u0000" + def.model;
      if ([...modelSel.options].some((o) => o.value === wanted)) modelSel.value = wanted;
      if (!available.length) setStatus(T("chat.noProvider"), true);
    } catch (e) {
      modelSel.innerHTML = "<option>" + esc(T("chat.detectFailed")) + "</option>";
      setStatus(T("chat.detectFailed") + "：" + e.message, true);
    }
  }

  function selected() {
    const v = modelSel.value || "";
    const i = v.indexOf("\u0000");
    if (i < 0) return { provider: "", model: "" };
    return { provider: v.slice(0, i), model: v.slice(i + 1) };
  }

  // ---------------- ZIM ----------------
  function zimShort(name) { return name.replace(/\.zim$/i, ""); }
  function updateZimButton() {
    $("zim-label").textContent = zimFilter.length ? zimFilter.map(zimShort).join(", ") : T("chat.zim.all");
    $("zim-count").textContent = zimList.length ? "(" + zimList.length + ")" : "";
  }
  async function loadZims() {
    try {
      const r = await fetch("/api/zim/list");
      const j = await r.json();
      zimList = (j.zims || []);
      const kv = $("zim-kv");
      kv.innerHTML = "";
      if (!zimList.length) {
        kv.appendChild(el("dt", "", T("session.status")));
        kv.appendChild(el("dd", "", T("kb.none")));
      } else {
        zimList.forEach((z) => {
          kv.appendChild(el("dt", "", zimShort(z.name)));
          kv.appendChild(el("dd", "", z.error
            ? (T("kb.card.broken") + z.error)
            : (z.entries.toLocaleString() + " · " + z.size_mb + " MB")));
        });
      }
      const menu = $("zim-menu");
      menu.innerHTML = "";
      menu.appendChild(el("div", "muted", T("chat.zim.menuHint")));
      zimList.forEach((z) => {
        const lab = document.createElement("label");
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.value = z.name;
        cb.addEventListener("change", () => {
          zimFilter = [...menu.querySelectorAll("input:checked")].map((x) => x.value);
          updateZimButton();
        });
        lab.appendChild(cb);
        lab.appendChild(el("span", "", zimShort(z.name) + " · " + z.entries.toLocaleString()));
        menu.appendChild(lab);
      });
      updateZimButton();
    } catch (e) {
      setStatus(T("chat.zimLoadFailed") + e.message, true);
    }
  }
  $("zim-btn").addEventListener("click", (e) => {
    e.stopPropagation();
    $("zim-menu").classList.toggle("open");
  });
  document.addEventListener("click", (e) => {
    if (!$("zim-menu").contains(e.target) && e.target !== $("zim-btn")) $("zim-menu").classList.remove("open");
  });

  // ---------------- messages ----------------
  function badge(kind) {
    const b = el("span", "badge k-" + kind, kindText(kind));
    return b;
  }

  function auditText(audit) {
    const pct = Math.round((audit.score || 0) * 100);
    return T("audit.score", { pct: pct, g: audit.sentences_grounded || 0, t: audit.sentences_total || 0 }) +
      (audit.sentences_unverified ? T("audit.unverified", { n: audit.sentences_unverified }) : "");
  }

  function msgNode(m, anns) {
    const role = m.role === "user" ? "user" : (m.role === "system" ? "system" : "assistant");
    const wrap = el("article", "msg " + role);
    const head = el("div", "msg-head");

    if (role === "user") turnNo += 1;
    head.appendChild(el("span", "turn", "#" + (role === "user" ? turnNo : Math.max(turnNo, 1))));
    head.appendChild(el("span", "who", T("msg." + (role === "user" ? "teacher" : (role === "system" ? "system" : "assistant")))));
    if (m.provider || m.model) head.appendChild(el("span", "prov", (m.provider || "?") + " · " + (m.model || "?")));
    if (m.latency_ms != null) head.appendChild(el("span", "", m.latency_ms + " ms"));
    if (m.tokens && m.tokens.out != null) head.appendChild(el("span", "", T("msg.outTokens", { n: m.tokens.out })));
    if (m.error === "cancelled") head.appendChild(el("span", "paused-tag", T("chat.pausedTag")));
    if (m.id) {
      const idEl = el("span", "mid", m.id);
      idEl.title = T("msg.clickToAnnotate");
      idEl.style.cursor = "pointer";
      idEl.addEventListener("click", () => { $("ann-target").value = m.id; $("ann-target").focus(); });
      head.appendChild(idEl);
      const forkBtn = el("button", "src-btn", T("msg.fork"));
      forkBtn.type = "button";
      forkBtn.title = T("msg.forkTitle");
      forkBtn.addEventListener("click", () => forkAt(m.id));
      head.appendChild(forkBtn);
    }
    if (m.edited_from) head.appendChild(el("span", "paused-tag", T("chat.editedTag")));
    if (m.id && role === "user") {
      const editBtn = el("button", "src-btn", T("chat.edit"));
      editBtn.type = "button";
      editBtn.title = T("chat.editTitle");
      editBtn.addEventListener("click", () => openEditModal(m));
      head.appendChild(editBtn);
    }
    if (role === "assistant" && m.parent) {
      const reBtn = el("button", "src-btn", T("chat.regenerate"));
      reBtn.type = "button";
      reBtn.title = T("chat.regenerateTitle");
      reBtn.addEventListener("click", () => regenerate(m.parent));
      head.appendChild(reBtn);
    }
    if (anns && anns.length) {
      const bs = el("span", "badges");
      anns.forEach((a) => bs.appendChild(badge(a.kind)));
      head.appendChild(bs);
    }
    wrap.appendChild(head);

    const bubble = el("div", "bubble" + (m.error ? " err" : ""), "");
    if (m.role === "system") bubble.style.opacity = ".72";
    if (m.html) {
      bubble.innerHTML = m.html;
      bubble.querySelectorAll(".cite").forEach((c) => {
        c.addEventListener("click", () => openSourceByNumber(c.dataset.n, c.dataset.q || lastQuestion));
      });
    } else {
      renderRich(bubble, m.content || "");
    }
    wrap.appendChild(bubble);
    if (m.error && m.error !== "cancelled") wrap.appendChild(el("div", "err-text", T("chat.callFailed") + m.error));

    const audit = m.audit || null;
    const sources = m.sources || [];
    if (audit) {
      const pct = Math.round((audit.score || 0) * 100);
      const ev = el("div", "evidence");
      ev.appendChild(el("span", "audit-pill" + (pct < 60 ? " warn" : ""), auditText(audit)));
      if ((audit.sentences || []).some((s) => !s.grounded && s.verified !== false)) {
        const b = el("button", "src-btn", T("audit.showIssues"));
        b.type = "button";
        b.addEventListener("click", () => showAudit(audit));
        ev.appendChild(b);
      }
      wrap.appendChild(ev);
    }
    if (sources.length) {
      const ev = el("div", "evidence");
      sources.forEach((s) => {
        const label = "[" + s.n + "] " + (s.title || s.path);
        const b = el("button", "src-btn", label.length > 34 ? label.slice(0, 34) + "…" : label);
        b.type = "button";
        b.title = s.zim + " · " + s.path;
        b.addEventListener("click", () => openSource(s.zim, s.path, s.title, lastQuestion));
        ev.appendChild(b);
      });
      wrap.appendChild(ev);
    }
    return { wrap, bubble };
  }

  async function streamChat(payload, opts) {
    opts = opts || {};
    if (busy) return;
    busy = true;
    sendBtn.disabled = true;
    stopBtn.style.display = "";
    stopBtn.disabled = false;
    pausedFlag = false;
    setStatus(opts.status || T("chat.generating"));

    if (flow.querySelector(".empty")) flow.innerHTML = "";
    if (opts.optimisticUser) {
      flow.appendChild(msgNode({ role: "user", content: opts.optimisticUser, id: "" }, []).wrap);
    }
    const ai = msgNode({ role: "assistant", content: "", provider: payload.provider, model: payload.model, id: "" }, []);
    flow.appendChild(ai.wrap);
    flow.scrollTop = flow.scrollHeight;

    let audit = null;
    try {
      const resp = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (!resp.ok && (resp.headers.get("content-type") || "").includes("json")) {
        const j = await resp.json();
        throw new Error(j.error || ("HTTP " + resp.status));
      }
      const reader = resp.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      let acc = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const chunks = buf.split("\n\n");
        buf = chunks.pop();
        for (const chunk of chunks) {
          const line = chunk.trim();
          if (!line.startsWith("data:")) continue;
          const evt = JSON.parse(line.slice(5).trim());
          if (evt.start) currentStream = evt.stream_id;
          if (evt.delta) {
            acc += evt.delta;
            ai.bubble.textContent = acc;
            flow.scrollTop = flow.scrollHeight;
          }
          if (evt.done) {
            const m = evt.meta || {};
            audit = m.audit || null;
            if (m.error === "cancelled") {
              pausedFlag = true;
              if (!ai.wrap.querySelector(".paused-tag")) {
                ai.wrap.querySelector(".msg-head").appendChild(el("span", "paused-tag", T("chat.pausedTag")));
              }
              setStatus(T("chat.paused"));
            } else if (m.error) {
              ai.bubble.classList.add("err");
              ai.wrap.appendChild(el("div", "err-text", T("chat.callFailed") + m.error));
              setStatus(T("chat.finishedError"), true);
            } else {
              setStatus(audit
                ? T("chat.doneWithAudit", { ms: m.latency_ms, pct: Math.round(audit.score * 100) })
                : T("chat.done", { ms: m.latency_ms }));
            }
          }
        }
      }
    } catch (e) {
      ai.bubble.classList.add("err");
      ai.wrap.appendChild(el("div", "err-text", T("chat.requestFailed") + e.message));
      setStatus(T("chat.requestFailed") + e.message, true);
    } finally {
      busy = false;
      currentStream = null;
      sendBtn.disabled = false;
      stopBtn.style.display = "none";
      if (renewSummary && !pausedFlag) renewSummary = "";
      await loadSession(branchId);
    }
  }

  async function send() {

    input.value = "";

    const payload = Object.assign(basePayload(sel), { message: text });
    if (renewSummary) payload.renew_summary = renewSummary;
    await streamChat(payload, {
      optimisticUser: text,
      status: groundedEl.checked ? T("chat.retrieving") : T("chat.generating")
    });
  }

      }
      row.appendChild(actions);
      list.appendChild(row);
    });
    listSec.appendChild(list);
    wrap.appendChild(listSec);

    // ---- add provider ----
    const addSec = el("section", "settings-section");
    addSec.appendChild(el("h4", "", T("settings.add")));
    const addForm = el("div", "provider-form");
    const idIn = document.createElement("input");
    idIn.placeholder = T("settings.id");
    const baseIn = document.createElement("input");
    baseIn.placeholder = "Base URL（如 api.deepseek.com/v1）";
    const keyIn = document.createElement("input");
    keyIn.type = "password";
    keyIn.placeholder = T("settings.key");
    const modelsIn = document.createElement("input");
    modelsIn.placeholder = T("settings.models");
    const addBtn = el("button", "btn small", T("settings.add"));
    addBtn.type = "button";
    addBtn.addEventListener("click", async () => {
      if (!idIn.value.trim() || !baseIn.value.trim()) { toast(T("settings.invalid")); return; }
      try {
        const rr = await fetch("/api/settings/provider", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            id: idIn.value.trim(),
            base: baseIn.value.trim(),
            key: keyIn.value.trim(),
            models: modelsIn.value
          })
        });
        const jj = await rr.json();
        if (!jj.success) throw new Error(jj.error || T("settings.invalid"));
        toast(T("settings.saved"));
        resetAfterSettings();
      } catch (e) {
        toast(T("settings.saveFailed") + e.message);
      }
    });
    addForm.appendChild(idIn);
    addForm.appendChild(baseIn);
    addForm.appendChild(keyIn);
    addForm.appendChild(modelsIn);
    addForm.appendChild(addBtn);
    addSec.appendChild(addForm);
    addSec.appendChild(el("p", "muted", T("settings.keyHint") + " " + T("settings.modelsHint")));
    wrap.appendChild(addSec);

    // ---- import from JSON ----
    const impSec = el("section", "settings-section");
    impSec.appendChild(el("h4", "", T("settings.importTitle")));
    impSec.appendChild(el("p", "muted", T("settings.importHint")));
    const ta = document.createElement("textarea");
    ta.placeholder = '{ "provider": { "deepseek": { "options": { "baseURL": "…", "apiKey": "…" }, "models": ["deepseek-flash"] } } }';
    ta.style.cssText = "width:100%;min-height:140px;margin:8px 0;font-family:var(--font-mono);font-size:12.5px;line-height:1.6;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:10px 12px;color:var(--ink);resize:vertical";
    const fileIn = document.createElement("input");
    fileIn.type = "file";
    fileIn.accept = ".json,application/json";
    fileIn.style.fontSize = "13px";
    fileIn.addEventListener("change", async () => {
      const f = fileIn.files && fileIn.files[0];
      if (f) ta.value = await f.text();
    });
    const impBtn = el("button", "btn small", T("settings.importBtn"));
    impBtn.type = "button";
    impBtn.addEventListener("click", async () => {
      try {
        const rr = await fetch("/api/settings/import", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ json: ta.value })
        });
        const jj = await rr.json();
        if (!jj.success) throw new Error(jj.error || T("settings.importFailed"));
        toast(T("settings.importOk", { n: jj.count || 0 }));
        resetAfterSettings();
      } catch (e) {
        toast(T("settings.importFailed") + e.message);
      }
    });
    const impRow = el("div", "composer-row");
    impRow.appendChild(fileIn);
    impRow.appendChild(impBtn);
    impSec.appendChild(ta);
    impSec.appendChild(impRow);
    wrap.appendChild(impSec);

    openModal(T("settings.title"), wrap, []);
  }

  async function resetAfterSettings() {
    await loadModels();
    await loadZims();
    await loadSession(branchId);
    openSettings();
  }

  $("btn-settings").addEventListener("click", openSettings);

  // ---------------- language ----------------
  langSel.addEventListener("change", () => {
    CLAPi18n.setLang(langSel.value);
  });
  CLAPi18n.onChange(() => {
    langSel.value = CLAPi18n.lang;
    syncModeLine();
    loadModels().then(() => loadSession(branchId));
    loadZims();
  });

  syncModeLine();
  loadModels().then(() => Promise.all([loadSession(), loadZims()]));
})();
</script>
</body>
</html>
