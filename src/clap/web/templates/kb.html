<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>CLAP · Knowledge</title>
<script>{% include "theme.js" %}</script>
<style>{% include "app.css" %}</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><strong>CLAP</strong><span data-i18n="app.kbSubtitle">知识库 · ZIM 外置库</span></div>
    <select id="lang" class="model-select" style="min-width:96px;max-width:120px" title="Language">
      <option value="zh">中文</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
      <option value="fr">Français</option>
      <option value="ru">Русский</option>
      <option value="de">Deutsch</option>
      <option value="es">Español</option>
      <option value="pt">Português</option>
      <option value="it">Italiano</option>
      <option value="ko">한국어</option>
    </select>
    <select id="theme" class="model-select" style="min-width:110px;max-width:150px" data-i18n-aria="theme.label" title="Theme">
      <option value="auto" data-i18n="theme.auto">跟随系统</option>
      <option value="light" data-i18n="theme.light">浅色</option>
      <option value="dark" data-i18n="theme.dark">深色</option>
    </select>
    <nav class="nav">
      <a href="/" data-i18n="nav.chat">对话</a>
      <a href="/kb" class="on" data-i18n="nav.kb">知识库</a>
      <a href="/timeline" id="tl-link" data-i18n="nav.timeline">时间轴</a>
      <a href="/api-docs" data-i18n="nav.api">接口</a>
    </nav>
  </header>

  <div class="toolbar">
    <span class="chip on" id="root-line" data-i18n="common.loading">加载中…</span>
    <span class="spacer"></span>
    <div class="group">
      <input id="share-path" data-i18n-placeholder="kb.importPlaceholder" placeholder="分享包路径（.clapshare）" style="font:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:280px">
      <button class="btn ghost small" id="adopt-btn" type="button" data-i18n="kb.import">导入分享包</button>
    </div>
    <span class="status" id="status" data-i18n="chat.status.ready">就绪</span>
  </div>

  <section class="kb-grid" id="zim-grid">
    <p class="empty" style="padding:16px 20px" data-i18n="common.loading">加载中…</p>
  </section>


  <section class="kb-work">
    <div class="panel">
      <div class="search-row">
        <input id="q" data-i18n-placeholder="kb.searchPlaceholder" placeholder="检索知识库（中文/英文均可，比如：量子 / transformer）">
        <button class="btn small" id="search-btn" data-i18n="kb.searchButton">检索</button>
      </div>
      <div class="results" id="results">
        <p class="empty" data-i18n="kb.resultsHint">输入关键词开始检索。ZIM 文件自带索引，查询不出网，也不会复制内容。</p>
      </div>
    </div>
    <div class="panel reader" id="reader">
      <p class="empty" data-i18n="kb.readerHint">点击左侧结果，在这里读原文。</p>
    </div>
  </section>


  <section class="panel" id="text-section" style="margin:16px 22px 0">
    <div class="card">
      <h2><span data-i18n="text.heading">文本资料</span> <span class="hint" data-i18n="text.hint">只接受纯文本（.txt / .md / .markdown / .text）</span></h2>
      <div class="composer-row">
        <input type="file" id="text-files" multiple accept=".txt,.md,.markdown,.text" style="font-size:13px;max-width:320px">
        <button class="btn small" id="text-upload" type="button" data-i18n="text.upload">添加文本文件</button>
        <span class="spacer"></span>
        <input id="text-path" data-i18n-placeholder="text.pathPlaceholder" placeholder="文件或目录路径" style="min-width:260px;max-width:420px">
        <button class="btn ghost small" id="text-add-path" type="button" data-i18n="text.addPath">按路径添加</button>
      </div>
      <div class="ann-list" id="text-list" style="max-height:280px"></div>
    </div>
  </section>

  <footer class="footer">
    <span data-i18n="kb.footerReadonly">只读 · 不复制 · 离线：ZIM 文件本身就是知识源。</span>
    <span data-i18n="kb.footerGrounded">在对话页开启「有依据模式」后，检索到的内容会作为唯一材料交给模型，并逐句核对来源。</span>
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>{% include "i18n.js" %}</script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const T = (k, v) => CLAPi18n.t(k, v);
  const langSel = $("lang");
  let zims = [];
  let textFiles = [];
  let lastQuery = "";
  let currentHit = null;

  langSel.value = CLAPi18n.lang;
  CLAPi18n.apply();
  const themeSel = document.getElementById("theme");
  themeSel.value = CLAPtheme.mode;
  themeSel.addEventListener("change", () => CLAPtheme.setMode(themeSel.value));

  function toast(t) {
    const n = $("toast");
    n.textContent = t;
    n.classList.add("show");
    clearTimeout(n._tm);
    n._tm = setTimeout(() => n.classList.remove("show"), 2600);
  }
  function setStatus(t, bad) {
    $("status").textContent = t;
    $("status").className = "status" + (bad ? " bad" : "");
  }
  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }
  const short = (n) => n.replace(/\.zim$/i, "");

  async function loadZims() {
    try {
      const r = await fetch("/api/zim/list");
      const j = await r.json();
      zims = j.zims || [];
      const shortRoots = (j.roots || []).map((r) => String(r).replace(/\\/g, "/").split("/").filter(Boolean).pop());
      $("root-line").textContent = T("kb.roots", { roots: shortRoots.join(" · ") || T("kb.rootsMissing") });
      const grid = $("zim-grid");
      grid.innerHTML = "";
      if (!zims.length) {
        const p = el("p", "empty", T("kb.empty"));
        p.style.padding = "16px 20px";
        grid.appendChild(p);
        return;
      }
      zims.forEach((z) => {
        const card = el("article", "panel zim-card");
        card.appendChild(el("h3", "", z.name));
        const nums = el("div", "nums");
        nums.appendChild(el("span", "", T("kb.card.entries") + " "));
        nums.lastChild.appendChild(el("b", "", z.entries.toLocaleString()));
        nums.appendChild(el("span", "", T("kb.card.size") + " "));
        nums.lastChild.appendChild(el("b", "", z.size_mb + " MB"));
        nums.appendChild(el("span", "", T("kb.card.language") + " " + (z.language || "—")));
        card.appendChild(nums);
        if (z.error) {
          card.appendChild(el("div", "bad", T("kb.card.broken") + z.error));
        } else {
          card.appendChild(el("div", "ok", T("kb.card.available")));
        }
        const go = el("button", "go", T("kb.card.searchThis"));
        go.type = "button";
        go.addEventListener("click", () => {
          $("q").value = "";
          $("q").focus();
          $("q").dataset.zim = z.name;
          toast(T("kb.card.locked", { name: z.name }));
        });
        card.appendChild(go);
        grid.appendChild(card);
      });
    } catch (e) {
      setStatus(T("chat.zimLoadFailed") + e.message, true);
    }
  }

  function highlight(text) {
    const n = el("div", "body");
    if (!lastQuery) { n.textContent = text; return n; }
    const q = lastQuery.split(/\s+/).filter(Boolean);
    if (!q.length) { n.textContent = text; return n; }
    const re = new RegExp("(" + q.map((t) => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi");
    const frag = document.createDocumentFragment();
    let last = 0, m;
    while ((m = re.exec(text)) !== null) {
      if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      frag.appendChild(el("mark", "", m[0]));
      last = m.index + m[0].length;
      if (m[0].length === 0) re.lastIndex++;
    }
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    n.appendChild(frag);
    return n;
  }

  async function readArticle(hit) {
    currentHit = hit;
    const isText = hit.kind === "text";
    setStatus(T("kb.reading"));
    try {
      let url;
      if (isText) {
        url = "/api/text/article?name=" + encodeURIComponent(hit.path);
      } else {
        url = "/api/zim/article?zim=" + encodeURIComponent(hit.zim) + "&path=" + encodeURIComponent(hit.path);
      }
      if (lastQuery) url += "&q=" + encodeURIComponent(lastQuery);
      const r = await fetch(url);
      const j = await r.json();
      if (!j.success) throw new Error(j.error || T("kb.readFailed"));
      const box = $("reader");
      box.innerHTML = "";
      box.appendChild(el("h2", "", j.title || hit.path));
      box.appendChild(el("div", "meta", (j.zim || (isText ? T("text.heading") : "")) + " · " + j.path + " · " + j.chars));
      const body = el("div", "body");
      const match = j.match;
      if (match && match.start < match.end && match.end <= j.text.length) {
        body.appendChild(document.createTextNode(j.text.slice(0, match.start)));
        const mark = el("mark", "", j.text.slice(match.start, match.end));
        mark.id = "kb-highlight";
        body.appendChild(mark);
        body.appendChild(document.createTextNode(j.text.slice(match.end)));
        box.appendChild(body);
        setTimeout(() => {
          const t = $("kb-highlight");
          if (t) t.scrollIntoView({ block: "center", behavior: "smooth" });
        }, 80);
      } else {
        box.appendChild(highlight(j.text));
      }
      setStatus(T("kb.opened", { n: j.chars }));
    } catch (e) {
      setStatus(T("kb.readFailed") + e.message, true);
    }
  }

  async function search() {
    const query = $("q").value.trim();
    if (!query) return;
    lastQuery = query;
    const zim = $("q").dataset.zim || "";
    $("search-btn").disabled = true;
    setStatus(T("kb.searching"));
    try {
      const [zr, tr] = await Promise.all([
        fetch("/api/zim/search", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query, zims: zim ? [zim] : undefined, top_k: 10 })
        }).then((r) => r.json()),
        fetch("/api/text/search", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query, top_k: 6 })
        }).then((r) => r.json()).catch(() => ({ results: [] }))
      ]);
      if (!zr.success) throw new Error(zr.error || T("kb.searchFailed"));
      const results = []
        .concat((zr.results || []).map((h) => Object.assign({}, h, { kind: "zim" })))
        .concat(((tr && tr.results) || []).map((h) => Object.assign({}, h, { kind: "text" })));
      const box = $("results");
      box.innerHTML = "";
      if (!results.length) {
        box.appendChild(el("p", "empty", T("kb.noMatch")));
        setStatus(T("kb.noMatch"));
        return;
      }
      results.forEach((h) => {
        const hit = el("div", "hit");
        const head = el("div", "composer-row");
        head.appendChild(el("div", "t", h.title || h.path));
        if (h.kind === "text") head.appendChild(el("span", "chip on", T("text.badge")));
        hit.appendChild(head);
        hit.appendChild(el("div", "p", (h.zim || T("text.heading")) + " · " + h.path));
        if (h.snippet) hit.appendChild(el("div", "s", h.snippet));
        hit.addEventListener("click", () => readArticle(h));
        box.appendChild(hit);
      });
      setStatus(T("kb.matches", { n: results.length }));
    } catch (e) {
      setStatus(T("kb.searchFailed") + e.message, true);
    } finally {
      $("search-btn").disabled = false;
    }
  }

  $("search-btn").addEventListener("click", search);
  $("q").addEventListener("keydown", (e) => { if (e.key === "Enter") search(); });

  $("adopt-btn").addEventListener("click", async () => {
    const p = $("share-path").value.trim();
    if (!p) { toast(T("kb.needPackage")); return; }
    try {
      const r = await fetch("/api/session/adopt", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ package: p, policy: "rename" })
      });
      const j = await r.json();
      if (!j.success) throw new Error(j.error || T("kb.importFailed"));
      const name = (j.record && (j.record.session_id || j.record.path)) || "";
      toast(T("kb.imported", { name: name }));
      setStatus(T("kb.importedStatus"));
    } catch (e) {
      setStatus(T("kb.importFailed") + e.message, true);
    }
  });

  // ---------------- text evidence ----------------
  async function loadTextFiles() {
    try {
      const r = await fetch("/api/text/list");
      const j = await r.json();
      textFiles = j.files || [];
      const box = $("text-list");
      box.innerHTML = "";
      if (!textFiles.length) {
        box.appendChild(el("p", "empty", T("text.empty")));
        return;
      }
      textFiles.forEach((f) => {
        const row = el("div", "ann-item");
        row.appendChild(el("span", "t", f.name));
        row.appendChild(el("span", "", f.size_kb + " KB"));
        const del = el("button", "src-btn", T("text.delete"));
        del.type = "button";
        del.addEventListener("click", async () => {
          if (!confirm(T("text.confirmDelete"))) return;
          await fetch("/api/text/delete", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: f.name })
          });
          loadTextFiles();
        });
        row.appendChild(del);
        box.appendChild(row);
      });
    } catch (e) {
      setStatus(T("text.failed") + e.message, true);
    }
  }

  $("text-upload").addEventListener("click", async () => {
    const files = [...($("text-files").files || [])];
    if (!files.length) { toast(T("text.formatOnly")); return; }
    const fd = new FormData();
    files.forEach((f) => fd.append("file", f, f.name));
    try {
      const r = await fetch("/api/text/add", { method: "POST", body: fd });
      const j = await r.json();
      if (!j.success) throw new Error(j.error || T("text.formatOnly"));
      toast(T("text.added", { n: j.count || 0 }));
      $("text-files").value = "";
      loadTextFiles();
    } catch (e) {
      setStatus(T("text.failed") + e.message, true);
    }
  });

  $("text-add-path").addEventListener("click", async () => {
    const path = $("text-path").value.trim();
    if (!path) return;
    try {
      const r = await fetch("/api/text/add_path", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path })
      });
      const j = await r.json();
      if (!j.success) throw new Error(j.error || T("text.formatOnly"));
      toast(T("text.added", { n: j.count || 0 }) +
        (j.skipped && j.skipped.length ? " · " + T("text.skipped", { n: j.skipped.length }) : ""));
      $("text-path").value = "";
      loadTextFiles();
    } catch (e) {
      setStatus(T("text.failed") + e.message, true);
    }
  });

  langSel.addEventListener("change", () => CLAPi18n.setLang(langSel.value));
  CLAPi18n.onChange(() => {
    langSel.value = CLAPi18n.lang;
    document.title = T("app.titleKb");
    setStatus(T("chat.status.ready"));
    loadZims();
    loadTextFiles();
    if (lastQuery) search();
    if (currentHit) readArticle(currentHit);
  });

  document.title = T("app.titleKb");
  loadZims();
  loadTextFiles();
})();
</script>
</body>
</html>
